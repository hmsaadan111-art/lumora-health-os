<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumora Health OS · St Aldric's General Hospital</title>
<meta name="description" content="Lumora Health OS: one system to run a hospital. Beds, A&E, theatres, patients, lab, pharmacy, staffing and billing, live.">
<meta property="og:title" content="Lumora Health OS">
<meta property="og:description" content="One system to run a hospital: beds, A&E, theatres, patients, lab, pharmacy, staffing and billing, live.">
<meta property="og:url" content="https://hmsaadan111-art.github.io/lumora-health-os/">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://hmsaadan111-art.github.io/lumora-health-os/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E5E8C'/%3E%3Cpath d='M32 13l15 8.7v17.3L32 47.7 17 39V21.7z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M32 22v17M23.5 30.5h17' stroke='%2312B5CB' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --s1:#FFFFFF; --s2:#F6F8FA; --ink:#0B1A2B; --ink2:#24364D; --muted:#5F6F86; --line:#DCE2EA; --line2:#E9EDF2;
  --pri:#0E5E8C; --pri-d:#0A4A6F; --pri-l:#E3EFF7; --cy:#12B5CB; --cy-l:#DDF5F8;
  --crit:#D63B3B; --crit-l:#FBE4E4; --high:#E2740F; --high-l:#FCEBDA; --med:#D9A912; --med-l:#FBF2D2; --ok:#22915C; --ok-l:#DDF2E7; --blue:#4C67E8; --blue-l:#E4E8FC; --lil:#8A79E6; --lil-l:#ECE8FC;
  --head:Poppins,"Segoe UI",sans-serif; --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --sh1:0 1px 2px rgba(11,26,43,.05),0 10px 26px -18px rgba(11,26,43,.35);
  --sh2:0 30px 70px -30px rgba(11,26,43,.55),0 12px 26px -16px rgba(11,26,43,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:radial-gradient(1100px 520px at 85% -8%,#D6E8F3 0%,transparent 60%),radial-gradient(900px 480px at -8% 108%,#DDF1F4 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.num{font-family:var(--head);font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#0B1A2B 0%,#0B2540 55%,#0A1A2C 100%);color:#B7C4D6;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:11px;padding:2px 10px 20px;color:#fff;font-family:var(--head);font-weight:600;font-size:18px;line-height:1.1}
.logo small{display:block;font-family:var(--sans);font-weight:500;font-size:12px;color:#7E93AE;margin-top:3px}
.ngroup{font-size:11.5px;font-weight:700;color:#5E7491;padding:16px 12px 6px;letter-spacing:.04em}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:#B7C4D6;text-align:left;transition:background .15s,color .15s;position:relative}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:#13263D;color:#fff}
.nav[aria-current="page"]{background:linear-gradient(90deg,rgba(18,181,203,.24),rgba(18,181,203,.05));color:#fff}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--cy)}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--crit);color:#fff;border-radius:999px;padding:1px 7px}
.side .grow{flex:1;min-height:16px}
.me{display:flex;gap:10px;align-items:center;background:#122339;border:1px solid #1E3553;border-radius:14px;padding:11px}
.me .av{width:36px;height:36px;border-radius:50%;background:var(--cy);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me b{color:#fff;font-size:13.5px;display:block}
.me select{background:transparent;border:0;color:#8FA4BF;font-size:12.5px;padding:0;cursor:pointer}
.me select option{color:var(--ink)}
.main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:14px 30px;background:rgba(237,240,244,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line2)}
.top h1{font-size:22px}
.top .sub{font-size:13px;color:var(--muted)}
.top .sp{flex:1}
.ask{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);color:var(--muted);min-width:280px;font-size:14px;box-shadow:var(--sh1)}
.ask kbd{margin-left:auto;font-family:var(--sans);font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--s2)}
.ask svg{width:18px;height:18px}
.live{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;font-weight:600;font-size:13.5px;background:var(--s1);border:1px solid var(--line)}
.live .pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,145,92,.6);animation:pl 1.8s infinite}
.live.off .pulse{background:#A9B6C6;animation:none}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(34,145,92,0)}100%{box-shadow:0 0 0 0 rgba(34,145,92,0)}}
.clock{font-family:var(--head);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.content{padding:26px 30px 70px}
.view{animation:vin .35s ease}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;font-weight:600;font-size:14.5px;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:translateY(1px)}
.b-pri{background:linear-gradient(180deg,#137AB0,#0E5E8C);color:#fff;box-shadow:0 2px 0 var(--pri-d),0 10px 20px -12px rgba(14,94,140,.9)}
.b-pri:hover{background:#127099}
.b-sec{background:var(--s1);border:1px solid var(--line);box-shadow:0 1px 0 var(--line2)}
.b-sec:hover{background:var(--s2);border-color:#C7D0DB}
.b-ok{background:var(--ok);color:#fff;box-shadow:0 2px 0 #187047}
.b-warn{background:var(--high);color:#fff;box-shadow:0 2px 0 #B65A08}
.b-danger{background:var(--s1);border:1px solid #F0C4C4;color:#B32C2C}
.b-danger:hover{background:var(--crit-l)}
.b-sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}
.b-sm svg{width:16px;height:16px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* cards, chips */
.card{background:var(--s1);border:1px solid var(--line2);border-radius:20px;box-shadow:0 1px 0 #fff inset,0 1px 2px rgba(11,26,43,.05),0 18px 40px -28px rgba(11,26,43,.5)}
.kpi{transition:transform .2s,box-shadow .2s}.kpi:hover{transform:translateY(-3px);box-shadow:0 24px 44px -26px rgba(11,26,43,.55)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 10px}
.ch h3{font-size:16.5px}
.ch .h-sub{font-size:13px;color:var(--muted)}
.cb{padding:6px 20px 20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--s2);color:var(--ink2);white-space:nowrap}
.chip .d{width:8px;height:8px;border-radius:50%;background:currentColor}
.c-crit{background:var(--crit-l);color:#B32C2C}.c-high{background:var(--high-l);color:#A95300}.c-med{background:var(--med-l);color:#8A6A00}.c-ok{background:var(--ok-l);color:#16714A}.c-blue{background:var(--blue-l);color:#3048B8}.c-lil{background:var(--lil-l);color:#5C49B8}.c-pri{background:var(--pri-l);color:var(--pri-d)}.c-cy{background:var(--cy-l);color:#0B7C8B}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .k{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .v{font-family:var(--head);font-size:36px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:500}
.kpi .t{font-size:12.5px;margin-top:6px;font-weight:600}
.kpi .bar{height:6px;border-radius:4px;background:var(--line2);margin-top:12px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:4px;transition:width .8s}
.kpi .ic{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 18px -10px rgba(11,26,43,.6)}
.kpi .ic svg{width:20px;height:20px}
.up{color:var(--ok)}.down{color:var(--crit)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--s2)}
td{padding:12px 14px;}
td.num{white-space:nowrap}
td{border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:#F8FAFC}
.tw{overflow:auto;border-radius:0 0 18px 18px}
.pname{font-weight:600}
.pmeta{font-size:12.5px;color:var(--muted)}
.lnk{color:var(--pri);font-weight:600;cursor:pointer}
.lnk:hover{text-decoration:underline}
.tri{width:6px;height:38px;border-radius:4px}
.prog{height:7px;border-radius:5px;background:var(--line2);overflow:hidden;min-width:110px}
.prog i{display:block;height:100%;border-radius:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{height:34px;padding:0 13px;border-radius:9px;font-weight:600;font-size:13.5px;background:var(--s1);border:1px solid var(--line);color:var(--ink2)}
.fbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.input{height:42px;border-radius:11px;border:1px solid var(--line);background:var(--s1);padding:0 13px;width:100%}
.input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
label.f{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* command centre: 3D hospital */
.hosp{position:relative;height:470px;perspective:1500px;overflow:hidden;border-radius:0 0 18px 18px;background:radial-gradient(ellipse at 50% 30%,#F4F8FB,#E6ECF2)}
.floor::before{content:"";position:absolute;inset:-46px;border-radius:28px;background-color:rgba(255,255,255,.45);background-image:repeating-linear-gradient(0deg,rgba(14,94,140,.07) 0 1px,transparent 1px 38px),repeating-linear-gradient(90deg,rgba(14,94,140,.07) 0 1px,transparent 1px 38px);box-shadow:0 0 0 1px rgba(14,94,140,.12)}
.floor{position:absolute;left:57%;top:50%;width:760px;height:430px;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(56deg) rotateZ(-32deg) scale(.9);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.hosp:hover .floor{transform:translate(-50%,-50%) rotateX(50deg) rotateZ(-26deg) scale(.9)}
.wardblk{position:absolute;background:#fff;border-radius:12px;box-shadow:0 0 0 1px #D3DCE6,2px 2px 0 #E0E7EE,4px 4px 0 #D5DDE6,6px 6px 0 #CAD4DE,8px 8px 0 #C0CBD7,18px 20px 30px rgba(11,26,43,.22);padding:10px;transform-style:preserve-3d;cursor:pointer;transition:transform .25s}
.wardblk:hover{transform:translateZ(16px)}
.wardblk .wn{font-family:var(--head);font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
.wardblk .wo{font-size:11px;color:var(--muted);font-weight:600}
.beds{display:grid;gap:4px;margin-top:6px}
.bc{width:15px;height:15px;border-radius:3px;transform-style:preserve-3d;transform:translateZ(0);transition:background .4s,transform .4s}
.bc.occ{background:var(--pri);transform:translateZ(5px);box-shadow:2px 2px 0 #08405F}
.bc.free{background:#C9F0DB;box-shadow:inset 0 0 0 1.5px var(--ok)}
.bc.cln{background:var(--lil);transform:translateZ(3px);box-shadow:2px 2px 0 #5F4FB9}
.bc.dis{background:var(--med);transform:translateZ(5px);box-shadow:2px 2px 0 #9F7C0B}
.bc.alert{background:var(--crit);transform:translateZ(10px);box-shadow:2px 2px 0 #8F1F1F;animation:blink 1.4s infinite}
@keyframes blink{50%{filter:brightness(1.35)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px;box-shadow:var(--sh2);z-index:5;opacity:0;transition:opacity .15s;min-width:170px}
.tip b{font-family:var(--head);font-size:14px;display:block;margin-bottom:3px}
.feed{display:flex;flex-direction:column;max-height:430px;overflow:auto}
.ev{display:flex;gap:11px;padding:11px 20px;border-top:1px solid var(--line2);animation:vin .4s}
.ev .ei{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.ev .ei svg{width:16px;height:16px}
.ev .et{font-size:13.5px;line-height:1.4}
.ev .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}

/* beds */
.wtabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:16px}
.wtab{flex:none;padding:10px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:13.5px;text-align:left}
.wtab small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.wtab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.wtab[aria-pressed="true"] small{color:#9FB2CB}
.bedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.bed{background:var(--s1);border-radius:16px;border:1px solid var(--line2);box-shadow:var(--sh1);padding:14px 15px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s,box-shadow .15s}
.bed:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.bed::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--st)}
.bed .bn{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.bed .who{font-weight:700;font-size:15px}
.bed .acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.news{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px}

/* theatres */
.tl{position:relative;padding:10px 20px 20px}
.tl-hours{display:grid;margin-left:120px;font-size:12px;color:var(--muted);font-weight:600}
.tl-row{display:flex;align-items:center;height:70px;border-top:1px solid var(--line2)}
.tl-row .tn{width:120px;flex:none;font-weight:700;font-size:14px}
.tl-row .tn small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tl-track{position:relative;flex:1;height:52px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),var(--line2) calc(10% - 1px),var(--line2) 10%)}
.case{position:absolute;top:4px;bottom:4px;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;overflow:hidden;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 rgba(11,26,43,.12);transition:transform .15s,filter .15s;white-space:nowrap}
.case:hover{transform:translateY(-2px);filter:brightness(.97)}
.case small{display:block;font-weight:500;opacity:.8}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);z-index:3}
.now::before{content:"Now";position:absolute;top:-20px;left:-14px;font-size:11px;font-weight:700;color:var(--crit)}

/* patient */
.pat-head{display:flex;gap:18px;align-items:center;padding:22px;flex-wrap:wrap}
.pav{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--cy))}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 22px 20px}
.kv div{background:var(--s2);border-radius:12px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{font-weight:600}
.tline{display:flex;flex-direction:column}
.tline .it{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.tline .it:last-child{border:0}
.tline time{width:92px;flex:none;color:var(--muted);font-size:12.5px;font-weight:600}

/* stock */
.lvl{display:flex;align-items:center;gap:10px}
.lvl .prog{flex:1}
.rota{display:grid;gap:8px}
.rcell{border-radius:11px;padding:9px 10px;font-weight:700;font-size:13.5px;text-align:center;cursor:pointer;border:1px solid transparent;transition:transform .12s}
.rcell:hover{transform:translateY(-1px)}
.rcell small{display:block;font-weight:600;font-size:11px;opacity:.8}

/* modal, toast, palette */
.scrim{position:fixed;inset:0;background:rgba(6,14,26,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:60}
.scrim.open{display:flex;animation:vin .2s}
.modal{background:var(--s1);border-radius:22px;box-shadow:var(--sh2);width:min(560px,100%);max-height:88vh;overflow:auto}
.modal .mh{padding:22px 24px 8px}
.modal .mh h2{font-size:22px}
.modal .mh p{color:var(--muted);font-size:14px;margin-top:4px}
.modal .mb{padding:10px 24px;display:grid;gap:14px}
.modal .mf{padding:16px 24px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;text-align:left;width:100%;transition:border .12s,background .12s}
.opt:hover{border-color:var(--pri);background:var(--pri-l)}
.opt[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-l)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;align-items:center;display:flex;flex-direction:column;gap:10px;z-index:70}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:#fff;padding:12px 15px;border-radius:13px;box-shadow:var(--sh2);font-size:14px;max-width:360px;animation:tin .3s}
.toast svg{width:18px;height:18px;flex:none;margin-top:1px}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.pal{width:min(640px,100%)}
.pal .pin{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.pal .pin input{flex:1;border:0;outline:0;font-size:17px;background:transparent}
.pal .pin svg{width:20px;height:20px;color:var(--muted)}
.pres{max-height:420px;overflow:auto;padding:8px}
.pr{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:11px}
.pr:hover,.pr.sel{background:var(--pri-l)}
.pr .pi{width:34px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center;flex:none}
.pr .pi svg{width:17px;height:17px}
.pr b{display:block;font-size:14.5px}
.pr span{font-size:12.5px;color:var(--muted)}

.cam{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:linear-gradient(180deg,#1B2836 0%,#24384B 55%,#2E4459 56%,#1A2633 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.cam::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none;z-index:3}
.cam .door{position:absolute;left:38%;top:16%;width:24%;height:42%;border:3px solid #3C5670;border-bottom:0;background:linear-gradient(#22374B,#2B4359)}
.cam .lbl{position:absolute;left:10px;top:8px;font-size:11.5px;font-weight:700;color:#DCE7F2;display:flex;align-items:center;gap:6px;z-index:4;text-shadow:0 1px 2px #000}
.cam .lbl i{width:8px;height:8px;border-radius:50%;background:#FF4D4D;animation:blink 1.2s infinite}
.cam .ts{position:absolute;right:10px;top:8px;font-size:11px;color:#B7C7D8;font-variant-numeric:tabular-nums;z-index:4;font-family:monospace}
.cam .who{position:absolute;bottom:6%;width:15%;height:62%;left:42%;z-index:2;animation:walkin 1.6s ease-out}
.cam .who svg{width:100%;height:100%}
.cam .box{position:absolute;left:43%;top:28%;width:13%;height:22%;border:2px solid var(--cy);border-radius:6px;z-index:4;box-shadow:0 0 12px rgba(18,181,203,.7)}
.cam .box.unk{border-color:#F2B04A;box-shadow:0 0 12px rgba(242,176,74,.7)}
.cam .tag{position:absolute;left:57%;top:27%;background:rgba(6,14,26,.85);color:#fff;font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:7px;z-index:4;white-space:nowrap}
.cam .tag b{color:#5FE3F2}.cam .tag.unk b{color:#F2B04A}
.cam .idle{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:#8FA4BF;z-index:4}
@keyframes walkin{from{transform:scale(.55) translateY(-30%);opacity:.3}to{transform:none;opacity:1}}
.det{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:#fff;margin-bottom:10px;cursor:pointer;transition:border .15s,background .15s}
.det:hover,.det.sel{border-color:var(--pri);background:var(--pri-l)}
.det .snap{width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,#2B4359,#1B2836);display:grid;place-items:center;flex:none;overflow:hidden}
.det .snap svg{width:34px;height:40px;margin-top:8px}
.conf{font-size:12px;font-weight:700;color:#0B7C8B}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);background:var(--s2);border-radius:14px;padding:12px 14px;margin-top:12px}
.privacy svg{width:18px;height:18px;flex:none;color:var(--pri);margin-top:1px}
@media print{
 body{background:#fff!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important;font-family:Inter,Arial,sans-serif;color:#000;font-size:12pt}
 #printArea h1{font-size:18pt;margin-bottom:4pt}#printArea h2{font-size:13pt;margin:14pt 0 6pt}
 #printArea table{width:100%;border-collapse:collapse;margin-top:8pt}
 #printArea th,#printArea td{border:1px solid #999;padding:5pt 6pt;text-align:left;font-size:10.5pt;background:none}
 #printArea .pm{color:#444;font-size:10pt}
 #printArea pre{white-space:pre-wrap;font-family:inherit;font-size:11pt;border:1px solid #999;padding:10pt;border-radius:4pt}
}

}

let R=rng(20261120);const pick=a=>a[Math.floor(R()*a.length)];const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const ic=(id,cls='')=>`<svg class="${cls}" width="18" height="18" aria-hidden="true"><use href="#i-${id}"/></svg>`;

/* ================= NEWS2 ================= */

 add(o.hr<=40?3:o.hr<=50?1:o.hr<=90?0:o.hr<=110?1:o.hr<=130?2:3);
 add(o.avpu==='A'?0:3);
 add(o.temp<=35?3:o.temp<=36?1:o.temp<=38?0:o.temp<=39?1:2);
 return {score:s,red,band:s>=7?'high':(s>=5||red)?'med':'low'}}

 const r3=rng(5);let f=m.free;const vals=names.map((n,i)=>{if(i)f=Math.max(0,f+Math.round((r3()-.55)*6)+(i===2||i===3?3:0));return f});const max=Math.max(...vals,12);
 const w=320,h=150;let pts=vals.map((v,i)=>[i*(w-56)/6+28,h-v/max*(h-24)]);
 let s=`<svg class="chart" viewBox="0 0 ${w} ${h+24}" role="img" aria-label="Free bed forecast"><defs><linearGradient id="fg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#12B5CB" stop-opacity=".35"/><stop offset="1" stop-color="#12B5CB" stop-opacity="0"/></linearGradient></defs>`;
 const safe=h-8/max*(h-24);s+=`<rect x="0" y="${safe}" width="${w}" height="${h-safe}" fill="#FBE4E4" opacity=".6"/><text x="${w-4}" y="${safe-4}" text-anchor="end" font-size="10" fill="#B32C2C" font-family="Inter" font-weight="600">Below 8 free: escalation</text>`;
 s+=`<path d="M${pts.map(p=>p.join(',')).join(' L')} L${pts[6][0]},${h} L${pts[0][0]},${h}Z" fill="url(#fg)"/><path d="M${pts.map(p=>p.join(',')).join(' L')}" fill="none" stroke="#0E5E8C" stroke-width="2.5" stroke-linejoin="round"/>`;
 pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#0E5E8C" stroke-width="2"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="11" font-weight="600" fill="#0B1A2B" font-family="Inter">${vals[i]}</text><text x="${p[0]}" y="${h+17}" text-anchor="middle" font-size="10" fill="#5F6F86" font-family="Inter">${names[i]}</text>`});
 return s+'</svg><div class="pmeta" style="margin-top:6px">Based on expected discharge dates and typical admissions by weekday.</div>'}

/* ---------- A&E ---------- */
const TRI={red:['Immediate','var(--crit)',0],orange:['Very urgent','var(--high)',10],yellow:['Urgent','var(--med)',60],green:['Standard','var(--ok)',120],blue:['Non-urgent','var(--blue)',240]};
let aeFilter='all';
VIEWS.ae=()=>{const m=M();const rows=DB.ae.filter(a=>aeFilter==='all'||(aeFilter==='breach'?minsAgo(a.arr)>=240:aeFilter==='admit'?a.status==='Decision to admit':a.area===aeFilter)).sort((a,b)=>Object.keys(TRI).indexOf(a.tri)-Object.keys(TRI).indexOf(b.tri)||a.arr-b.arr);
 return `<div class="grid g4" style="margin-bottom:18px">${kpi('In department',m.aeN,`${DB.ae.filter(a=>a.area==='Resus').length} in resus`,'',null,'var(--pri)','ae','var(--pri-l)')}${kpi('Seen within 4 hours',m.within+'<small>%</small>','National standard 78%',m.within<78?'down':'up',m.within,m.within<78?'var(--high)':'var(--ok)','check',m.within<78?'var(--high-l)':'var(--ok-l)')}${kpi('Longest wait',dur(m.longest),m.longest>=240?'Over 4 hours':'Within 4 hours',m.longest>=240?'down':'up',null,'var(--crit)','op','var(--crit-l)')}${kpi('Waiting for a bed',m.awaiting,`${m.free} beds free in the hospital`,'',null,'var(--high)','bed','var(--high-l)')}</div>
 <div class="card"><div class="ch"><div class="filters">${[['all','Everyone'],['Resus','Resus'],['Majors','Majors'],['Minors','Minors'],['Paeds','Paeds'],['breach','Over 4 hours'],['admit','Waiting for a bed']].map(f=>`<button class="fbtn" data-aef="${f[0]}" aria-pressed="${aeFilter===f[0]}">${f[1]}</button>`).join('')}</div><button class="btn b-pri b-sm" id="newArr">${ic('plus')}New arrival</button></div>
 <div class="tw"><table><thead><tr><th></th><th>Patient</th><th>Complaint</th><th>Area</th><th>Status</th><th>Time in department</th><th></th></tr></thead><tbody>${rows.map(a=>{const mins=minsAgo(a.arr);const pc=Math.min(100,mins/240*100);const col=mins>=240?'var(--crit)':mins>=180?'var(--high)':'var(--ok)';
  return `<tr><td style="width:24px;padding-right:0"><div class="tri" style="background:${TRI[a.tri][1]}" title="${TRI[a.tri][0]}"></div></td><td><div class="pname">${esc(a.name)}</div><div class="pmeta">${a.age}${a.sex} · ${TRI[a.tri][0]}</div></td><td>${esc(a.complaint)}</td><td><span class="chip">${a.area}</span></td><td><span class="chip ${a.status==='Decision to admit'?'c-high':a.status==='Waiting for triage'?'c-crit':a.status==='In assessment'?'c-pri':''}">${a.status}${a.target?' · '+W(a.target).short:''}</span></td>
  <td><div style="display:flex;align-items:center;gap:10px"><b class="num" style="min-width:58px;color:${col}">${dur(mins)}</b><div class="prog"><i style="width:${pc}%;background:${col}"></i></div></div></td>
  <td style="text-align:right;white-space:nowrap">${aeActions(a)}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No patients match this filter.</td></tr>'}</tbody></table></div></div>`};
function aeActions(a){
 if(a.status==='Waiting for triage')return `<button class="btn b-pri b-sm" data-ae="triage" data-id="${a.id}">Triage</button>`;
 if(a.status==='Decision to admit')return `<button class="btn b-ok b-sm" data-ae="admit" data-id="${a.id}">${ic('bed')}Find a bed</button>`;
 return `<button class="btn b-sec b-sm" data-ae="admitreq" data-id="${a.id}">Admit</button> <button class="btn b-sec b-sm" data-ae="home" data-id="${a.id}">Discharge home</button>`}
AFTER.ae=()=>{
 $$('[data-aef]').forEach(b=>b.addEventListener('click',()=>{aeFilter=b.dataset.aef;refresh()}));
 $('#newArr').addEventListener('click',newArrival);
 $$('[data-ae]').forEach(b=>b.addEventListener('click',()=>{const a=DB.ae.find(x=>x.id===b.dataset.id);const act=b.dataset.ae;
  if(act==='triage')triageModal(a);
  if(act==='home'){const u=snap();DB.ae=DB.ae.filter(x=>x!==a);log('dis',`<b>${esc(a.name)}</b> discharged home from A&amp;E after ${dur(minsAgo(a.arr))}`);save();toast(`${esc(a.name)} discharged home`,'ok',()=>undoTo(u,`${esc(a.name)} is back on the A&amp;E board`));refresh()}
  if(act==='admitreq')wardPick(`Admit ${esc(a.name)}`,'Which specialty should take this patient?',w=>{a.status='Decision to admit';a.target=w;log('ae',`Decision to admit <b>${esc(a.name)}</b> to ${W(w).name}`);save();toast('Bed requested from '+W(w).name);closeM()});
  if(act==='admit')bedPick(a)}));
};
function triageModal(a){modal(`<div class="mh"><h2>Triage ${esc(a.name)}</h2><p>${esc(a.complaint)} · arrived ${dur(minsAgo(a.arr))} ago. Choose a category using the Manchester Triage System.</p></div><div class="mb"><div class="opts">${Object.entries(TRI).map(([k,v])=>`<button class="opt" data-t="${k}"><span class="tri" style="height:28px;background:${v[1]}"></span><span style="flex:1"><b>${v[0]}</b><span class="pmeta" style="display:block">See within ${v[2]?v[2]+' minutes':'immediately'}</span></span></button>`).join('')}</div></div><div class="mf"><button class="btn b-sec" onclick="closeM()">Cancel</button></div>`);
 $$('#modal [data-t]').forEach(b=>b.addEventListener('click',()=>{a.tri=b.dataset.t;a.status='Waiting for clinician';if(a.tri==='red')a.area='Resus';log('ae',`<b>${esc(a.name)}</b> triaged: ${TRI[a.tri][0]}`);save();toast(`Triaged as ${TRI[a.tri][0]}`);closeM()}))}
function newArrival(){modal(`<div class="mh"><h2>New arrival</h2><p>Register a patient arriving in A&amp;E.</p></div><div class="mb"><div><label class="f" for="naN">Full name</label><input class="input" id="naN" placeholder="e.g. Jane Smith"></div><div class="grid g2" style="gap:12px"><div><label class="f" for="naA">Age</label><input class="input" id="naA" type="number" min="0" max="120" value="45"></div><div><label class="f" for="naS">Sex</label><select class="input" id="naS"><option>F</option><option>M</option></select></div></div><div><label class="f" for="naC">Presenting complaint</label><input class="input" id="naC" placeholder="e.g. Chest pain"></div><div><label class="f" for="naR">Arrived by</label><select class="input" id="naR"><option>Walk-in</option><option>Ambulance</option></select></div></div><div class="mf"><button class="btn b-sec" onclick="closeM()">Cancel</button><button class="btn b-pri" id="naGo">${ic('plus')}Register arrival</button></div>`);
 $('#naGo').addEventListener('click',()=>{const n=$('#naN').value.trim(),c=$('#naC').value.trim();if(!n||!c){toast('Add a name and complaint','warn');return}
  DB.ae.unshift({id:'A'+(DB.seq++)+'n',name:n,age:+$('#naA').value||0,sex:$('#naS').value,complaint:c,tri:'yellow',arr:Date.now(),status:'Waiting for triage',area:$('#naR').value==='Ambulance'?'Majors':'Minors'});
  log('ae',`<b>${esc(n)}</b> arrived in A&amp;E (${$('#naR').value.toLowerCase()}): ${esc(c)}`);save();toast(`${esc(n)} registered. Next step: triage.`);closeM()})}
function wardPick(t,s,cb){modal(`<div class="mh"><h2>${t}</h2><p>${s}</p></div><div class="mb"><div class="opts">${WARDS.map(w=>{const f=DB.beds.filter(b=>b.ward===w.id&&b.st==='free').length;return `<button class="opt" data-w="${w.id}"><span style="flex:1"><b>${w.name}</b></span><span class="chip ${f?'c-ok':'c-crit'}">${f} free</span></button>`}).join('')}</div></div><div class="mf"><button class="btn b-sec" onclick="closeM()">Cancel</button></div>`);$$('#modal [data-w]').forEach(b=>b.addEventListener('click',()=>cb(b.dataset.w)))}
function bedPick(a){const w=a.target;const free=DB.beds.filter(b=>b.st==='free');const pref=free.filter(b=>b.ward===w),other=free.filter(b=>b.ward!==w).slice(0,6);
 modal(`<div class="mh"><h2>Find a bed for ${esc(a.name)}</h2><p>Requested: ${W(w).name}. Free beds in that ward are shown first.</p></div><div class="mb"><div class="opts">${pref.concat(other).map(b=>`<button class="opt" data-b="${b.id}"><span style="flex:1"><b>${W(b.ward).name}, bed ${b.no}</b>${b.ward!==w?'<span class="pmeta" style="display:block">Outlier: different specialty ward</span>':''}</span><span class="chip c-ok">Ready</span></button>`).join('')||'<div class="empty">No free beds. Speed up discharges or cleaning to free one.</div>'}</div></div><div class="mf"><button class="btn b-sec" onclick="closeM()">Cancel</button></div>`);
 $$('#modal [data-b]').forEach(x=>x.addEventListener('click',()=>{const u=snap();admitTo(a,DB.beds.find(b=>b.id===x.dataset.b),u);closeM()}))}
function admitTo(a,b,u,quiet){const w=W(b.ward);const p={id:'P'+(900000+(DB.seq++)),name:a.name,sex:a.sex,age:a.age,nhs:`${400+Math.floor(Math.random()*399)} ${100+Math.floor(Math.random()*899)} ${1000+Math.floor(Math.random()*8999)}`,ward:b.ward,bed:b.id,cons:CONS[Math.floor(Math.random()*CONS.length)],admitted:Date.now(),reason:a.complaint,obs:[{t:Date.now(),rr:18,spo2:96,o2:false,sbp:128,hr:88,avpu:'A',temp:37.2}],allergies:[],meds:[],edd:Date.now()+3*DAY,status:'inpatient',events:[[a.arr,'Arrived in A&E: '+a.complaint],[Date.now(),`Admitted to ${w.name}, bed ${b.no}`]]};
 DB.patients[p.id]=p;b.st='occ';b.pid=p.id;b.dis=false;DB.ae=DB.ae.filter(x=>x!==a);log('adm',`<b>${esc(a.name)}</b> admitted from A&amp;E to ${w.name}, bed ${b.no}`);save();if(!quiet)toast(`${esc(a.name)} admitted to ${w.short} bed ${b.no}`,'ok',u?()=>undoTo(u,'Admission undone'):null)}

/* ---------- BEDS ---------- */
let bedWard='amu';
VIEWS.beds=()=>{const w=W(bedWard);const bs=DB.beds.filter(b=>b.ward===bedWard);const m=M();
 return `<div class="wtabs">${WARDS.map(x=>{const b=DB.beds.filter(y=>y.ward===x.id);const o=b.filter(y=>y.st==='occ').length;const al=b.filter(y=>bedState(y)==='alert').length;return `<button class="wtab" data-ward="${x.id}" aria-pressed="${x.id===bedWard}">${x.name}${al?` <span class="chip c-crit" style="padding:0 7px;margin-left:4px">${al}</span>`:''}<small>${o}/${b.length} occupied · ${b.filter(y=>y.st==='free').length} free</small></button>`}).join('')}</div>
 ${m.awaiting?`<div class="card" style="padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;background:var(--high-l);border-color:#F4D3B0"><span style="color:var(--high)">${ic('alert','')}</span><b style="flex:1">${m.awaiting} A&amp;E patient${m.awaiting>1?'s are':' is'} waiting for a bed.</b><button class="btn b-warn b-sm" data-r="ae">Open A&amp;E board</button></div>`:''}
 <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn b-sec b-sm" id="handover">${ic('print')}Print ward handover</button></div>
 <div class="bedgrid">${bs.map(b=>bedCard(b)).join('')}</div>`};
function handoverDoc(wid){const w=W(wid);const bs=DB.beds.filter(b=>b.ward===wid);
 const rows=bs.map(b=>{if(b.st!=='occ')return `<tr><td>${b.no}</td><td colspan="6" class="pm">${b.st==='free'?'Free, clean and ready':'Being cleaned'}</td></tr>`;const p=P(b.pid);const n=curNews(p);const o=p.obs[p.obs.length-1];

 return `<h1>Ward handover: ${esc(w.name)}</h1><div class="pm">St Aldric's General Hospital · printed ${fdate(Date.now())} ${hm(new Date())} by ${esc($('#meName').textContent)} · ${bs.filter(b=>b.st==='occ').length}/${bs.length} beds occupied</div><table><thead><tr><th>Bed</th><th>Patient</th><th>Reason</th><th>NEWS2</th><th>Allergies</th><th>EDD</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table>`}

 if(b.st==='free')return `<div class="bed" style="--st:${col}"><div class="bn">Bed ${b.no}<span class="chip c-ok"><span class="d"></span>Free</span></div><div class="pmeta">Clean and ready</div><div class="acts"><button class="btn b-pri b-sm" data-bed="admit" data-id="${b.id}">${ic('in')}Admit patient</button></div></div>`;
 if(b.st==='cln')return `<div class="bed" style="--st:${col}"><div class="bn">Bed ${b.no}<span class="chip c-lil"><span class="d"></span>Cleaning</span></div><div class="pmeta">Domestic team on the way</div><div class="acts"><button class="btn b-sec b-sm" data-bed="clean" data-id="${b.id}">${ic('check')}Mark as clean</button></div></div>`;
 const p=P(b.pid);const n=curNews(p);const los=Math.max(0,Math.floor((Date.now()-p.admitted)/DAY));

   $$('#modal [data-q]').forEach(o=>o.addEventListener('click',()=>{admitTo(DB.ae.find(y=>y.id===o.dataset.q),b);closeM()}))}

 const summary=`${p.name}, ${p.age}${p.sex}, NHS ${p.nhs}\nAdmitted ${fdate(p.admitted)} under ${p.cons} with ${p.reason.toLowerCase()}.\nLength of stay: ${Math.max(1,Math.ceil((Date.now()-p.admitted)/DAY))} days. Latest NEWS2 ${n.score}.\nMedicines on discharge: ${p.meds.join(', ')||'none'}.\nAllergies: ${p.allergies.join(', ')||'none known'}.\nFollow-up: GP review in 2 weeks.`;

/* ---------- THEATRES ---------- */
VIEWS.theatres=()=>{const T0=new Date();T0.setHours(8,0,0,0);const s=T0.getTime(),span=10*3600000;const now=Date.now();
 const st=c=>c.status==='done'?['var(--ok-l)','#16714A','Complete']:c.status==='delayed'?['var(--high-l)','#A95300','Delayed']:(now>=c.start&&now<c.end)||c.status==='live'?['var(--pri)','#fff','In theatre']:now>=c.end?['var(--ok-l)','#16714A','Complete']:['var(--pri-l)','var(--pri-d)','Scheduled'];
 const cases=DB.theatres;const done=cases.filter(c=>st(c)[2]==='Complete').length;const live=cases.filter(c=>st(c)[2]==='In theatre').length;const m=M();
 return `<div class="grid g4" style="margin-bottom:18px">${kpi('Cases today',cases.length,`${done} complete · ${live} in progress`,'',null,'var(--pri)','op','var(--pri-l)')}${kpi('Theatre utilisation',m.util+'<small>%</small>','Booked time vs session time','up',m.util,'var(--cy)','op','var(--cy-l)')}${kpi('Delayed cases',cases.filter(c=>c.status==='delayed').length,'Late starts flagged by the team','',null,'var(--high)','alert','var(--high-l)')}${kpi('Emergency list',cases.filter(c=>c.th===2).length,'Theatre 3 kept free for emergencies','',null,'var(--crit)','ae','var(--crit-l)')}</div>
 <div class="card"><div class="ch"><div><h3>Today's lists</h3><div class="h-sub">Click a case to update it</div></div><div class="legend"><span><i style="background:var(--pri-l)"></i>Scheduled</span><span><i style="background:var(--pri)"></i>In theatre</span><span><i style="background:var(--ok-l)"></i>Complete</span><span><i style="background:var(--high-l)"></i>Delayed</span></div></div>
 <div class="tl" style="overflow:auto"><div style="min-width:900px"><div class="tl-hours" style="grid-template-columns:repeat(10,1fr)">${Array.from({length:10},(_,i)=>`<span>${pad(8+i)}:00</span>`).join('')}</div>
 ${['Theatre 1|General','Theatre 2|Orthopaedics','Theatre 3|Emergency','Theatre 4|Day surgery'].map((t,i)=>{const [n,sp]=t.split('|');return `<div class="tl-row"><div class="tn">${n}<small>${sp}</small></div><div class="tl-track">${(now>s&&now<s+span)?`<div class="now" style="left:${(now-s)/span*100}%"></div>`:''}${cases.filter(c=>c.th===i).map(c=>{const [bg,fg,lab]=st(c);const l=Math.max(0,(c.start-s)/span*100),w=Math.min(100-l,(c.end-c.start)/span*100);return `<div class="case" data-case="${c.id}" style="left:${l}%;width:${w}%;background:${bg};color:${fg}" title="${esc(c.name)}">${esc(c.name)}<small>${hm(new Date(c.start))}–${hm(new Date(c.end))} · ${lab}</small></div>`}).join('')}</div></div>`}).join('')}
 </div></div></div>`};
function reflow(th){const L=DB.theatres.filter(x=>x.th===th).sort((a,b)=>a.start-b.start);for(let i=1;i<L.length;i++){const gap=L[i-1].end+15*60000;if(L[i].start<gap&&L[i].status!=='done'){const d=gap-L[i].start;L[i].start+=d;L[i].end+=d}}}
AFTER.theatres=()=>$$('[data-case]').forEach(el=>el.addEventListener('click',()=>{const c=DB.theatres.find(x=>x.id===el.dataset.case);
 modal(`<div class="mh"><h2>${esc(c.name)}</h2><p>${esc(c.pt)} · ${esc(c.surgeon)} · ${hm(new Date(c.start))}–${hm(new Date(c.end))}</p></div><div class="mb"><div class="opts">
 <button class="opt" data-a="live">${ic('play','')}<span style="flex:1"><b>Patient in theatre</b><span class="pmeta" style="display:block">Starts the case now</span></span></button>
 <button class="opt" data-a="done">${ic('check','')}<span style="flex:1"><b>Case complete</b><span class="pmeta" style="display:block">Patient moved to recovery</span></span></button>
 <button class="opt" data-a="delay">${ic('alert','')}<span style="flex:1"><b>Delay by 30 minutes</b><span class="pmeta" style="display:block">Later cases on this list move too</span></span></button></div></div><div class="mf"><button class="btn b-sec" onclick="closeM()">Close</button></div>`);
 $$('#modal [data-a]').forEach(o=>{o.querySelector('svg').style.cssText='width:20px;height:20px;color:var(--pri)';o.addEventListener('click',()=>{const a=o.dataset.a;
  if(a==='live'){const d=Date.now()-c.start;c.start+=d;c.end+=d;c.status='live';reflow(c.th);log('op',`${esc(c.name)} started in Theatre ${c.th+1}`)}
  if(a==='done'){c.end=Math.min(c.end,Date.now());if(c.end<=c.start)c.start=c.end-30*60000;c.status='done';log('op',`${esc(c.name)} complete, patient in recovery`)}
  if(a==='delay'){DB.theatres.filter(x=>x.th===c.th&&x.start>=c.start&&x.status!=='done').forEach(x=>{x.start+=1800000;x.end+=1800000});c.status='delayed';reflow(c.th);log('op',`Theatre ${c.th+1} list delayed by 30 minutes`)}
  save();toast('Theatre list updated');closeM()})})}));

let pq='';
VIEWS.patients=()=>{const list=Object.values(DB.patients).filter(p=>p.status==='inpatient'&&(!pq||(p.name+' '+p.nhs+' '+W(p.ward).name+' '+p.reason).toLowerCase().includes(pq.toLowerCase()))).sort((a,b)=>curNews(b).score-curNews(a).score);
 return `<div class="card"><div class="ch"><div style="flex:1;max-width:420px"><input class="input" id="pq" placeholder="Search by name, NHS number, ward or reason" value="${esc(pq)}"></div><span class="h-sub">${list.length} inpatients · sorted by NEWS2</span></div>
 <div class="tw"><table><thead><tr><th>Patient</th><th>Ward</th><th>Reason for admission</th><th>Consultant</th><th>NEWS2</th><th>Day</th></tr></thead><tbody>${list.slice(0,80).map(p=>{const b=DB.beds.find(x=>x.id===p.bed);return `<tr><td><div class="pname lnk" data-go="patient/${p.id}">${esc(p.name)}</div><div class="pmeta">${p.age}${p.sex} · NHS ${p.nhs}</div></td><td>${W(p.ward).short}${b?' · bed '+b.no:''}</td><td>${esc(p.reason)}</td><td>${esc(p.cons)}</td><td>${newsChip(curNews(p))}</td><td class="num">${Math.floor((Date.now()-p.admitted)/DAY)+1}</td></tr>`}).join('')}</tbody></table></div></div>`};

VIEWS.patient=()=>{const p=P(param);if(!p)return '<div class="empty">Patient not found.</div>';const n=curNews(p);const b=DB.beds.find(x=>x.id===p.bed);const o=p.obs[p.obs.length-1];
 const labs=DB.labs.filter(l=>l.pid===p.id);
 return `<button class="btn b-sec b-sm" data-r="patients" style="margin-bottom:14px">${ic('back')}All patients</button>
 <div class="card" style="margin-bottom:18px"><div class="pat-head"><div class="pav">${p.name.split(' ').map(x=>x[0]).join('')}</div><div style="flex:1;min-width:220px"><h2 style="font-size:24px">${esc(p.name)}</h2><div class="pmeta" style="font-size:14px">${p.age} years · ${p.sex==='F'?'Female':'Male'} · NHS ${p.nhs} · ${p.status==='inpatient'?`${W(p.ward).name}${b?', bed '+b.no:''}`:'Discharged'}</div></div>${newsChip(n)} ${p.allergies.length?`<span class="chip c-crit">Allergy: ${p.allergies.join(', ')}</span>`:'<span class="chip c-ok">No known allergies</span>'}
 <div style="display:flex;gap:8px;flex-wrap:wrap">${p.status==='inpatient'?`<button class="btn b-pri b-sm" id="obsBtn">${ic('heart')}Record observations</button><button class="btn b-sec b-sm" id="ordBtn">${ic('lab')}Order test</button>`:''}</div></div>
 <div class="kv"><div><span>Reason for admission</span><b>${esc(p.reason)}</b></div><div><span>Consultant</span><b>${esc(p.cons)}</b></div><div><span>Admitted</span><b>${fdate(p.admitted)} · day ${Math.floor((Date.now()-p.admitted)/DAY)+1}</b></div><div><span>Expected discharge</span><b>${fdate(p.edd)}</b></div></div></div>
 <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
  <div class="card"><div class="ch"><div><h3>NEWS2 trend</h3><div class="h-sub">Last observations: RR ${o.rr} · SpO₂ ${o.spo2}%${o.o2?' on O₂':''} · BP ${o.sbp} · HR ${o.hr} · ${o.temp}°C · ${o.avpu==='A'?'Alert':'Not alert'}</div></div></div><div class="cb">${newsChart(p)}</div></div>
  <div class="card"><div class="ch"><h3>Medicines</h3></div><div class="cb">${p.meds.map(m=>`<div class="opt" style="margin-bottom:8px;cursor:default">${ic('pill','')}<b style="font-size:14px">${esc(m)}</b></div>`).join('')||'<div class="pmeta">No medicines charted.</div>'}</div>
   <div class="ch" style="padding-top:4px"><h3>Tests</h3></div><div class="cb">${labs.map(l=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14px"><span>${esc(l.test)}</span><span class="chip ${l.abn?'c-crit':l.status==='Resulted'?'c-ok':''}">${l.abn?'Abnormal':l.status}</span></div>`).join('')||'<div class="pmeta">No tests ordered.</div>'}</div></div>
 </div>
 <div class="card" style="margin-top:18px"><div class="ch"><h3>Timeline</h3></div><div class="cb"><div class="tline">${[...p.events].reverse().map(e=>`<div class="it"><time>${fdate(e[0])} ${hm(new Date(e[0]))}</time><span>${esc(e[1])}</span></div>`).join('')}</div></div></div>`};
function newsChart(p){const w=560,h=180,obs=p.obs.slice(-8);const n=obs.map(o=>news2(o).score);const max=12;const x=i=>30+i*(w-50)/Math.max(1,obs.length-1),y=v=>h-v/max*(h-20)-10;
 let s=`<svg class="chart" viewBox="0 0 ${w} ${h+20}" role="img" aria-label="NEWS2 scores over time">`;
 s+=`<rect x="30" y="${y(12)}" width="${w-50}" height="${y(7)-y(12)}" fill="#FBE4E4"/><rect x="30" y="${y(7)}" width="${w-50}" height="${y(5)-y(7)}" fill="#FCEBDA"/><rect x="30" y="${y(5)}" width="${w-50}" height="${y(0)-y(5)}" fill="#EEF8F2"/>`;
 [0,5,7,12].forEach(v=>s+=`<text x="22" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#5F6F86" font-family="Inter">${v}</text>`);
 s+=`<path d="M${n.map((v,i)=>x(i)+','+y(v)).join(' L')}" fill="none" stroke="#0B1A2B" stroke-width="2.5" stroke-linejoin="round"/>`;
 n.forEach((v,i)=>{const c=v>=7?'#D63B3B':v>=5?'#E2740F':'#22915C';s+=`<circle cx="${x(i)}" cy="${y(v)}" r="6" fill="${c}" stroke="#fff" stroke-width="2"/><text x="${x(i)}" y="${y(v)-11}" text-anchor="middle" font-size="11" font-weight="700" fill="#0B1A2B" font-family="Inter">${v}</text><text x="${x(i)}" y="${h+14}" text-anchor="middle" font-size="10" fill="#5F6F86" font-family="Inter">${hm(new Date(obs[i].t))}</text>`});
 return s+'</svg>'}
AFTER.patient=()=>{const p=P(param);if(!p||p.status!=='inpatient')return;
 $('#obsBtn').addEventListener('click',()=>{const o=p.obs[p.obs.length-1];
  modal(`<div class="mh"><h2>Record observations</h2><p>${esc(p.name)} · NEWS2 updates as you type.</p></div><div class="mb"><div class="grid g3" style="gap:12px">
  ${[['rr','Resp. rate',o.rr],['spo2','SpO₂ %',o.spo2],['sbp','Systolic BP',o.sbp],['hr','Pulse',o.hr],['temp','Temp °C',o.temp]].map(f=>`<div><label class="f" for="o_${f[0]}">${f[1]}</label><input class="input ob" id="o_${f[0]}" type="number" step="${f[0]==='temp'?'0.1':'1'}" value="${f[2]}"></div>`).join('')}
  <div><label class="f" for="o_avpu">Consciousness</label><select class="input ob" id="o_avpu"><option value="A">Alert</option><option value="C">New confusion</option><option value="V">Voice</option><option value="P">Pain</option><option value="U">Unresponsive</option></select></div></div>
  <label class="opt" style="cursor:pointer"><input type="checkbox" id="o_o2" class="ob" ${o.o2?'checked':''} style="width:20px;height:20px;accent-color:var(--pri)"><span>On supplemental oxygen</span></label>
  <div id="oScore" class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px"></div></div>
  <div class="mf"><button class="btn b-sec" onclick="closeM()">Cancel</button><button class="btn b-pri" id="oSave">${ic('check')}Save observations</button></div>`);

  $$('#modal [data-t]').forEach(o=>{o.querySelector('svg').style.cssText='width:18px;height:18px;color:var(--pri)';o.addEventListener('click',()=>{DB.labs.unshift({id:'L'+(2000+DB.seq++),test:o.dataset.t,pid:p.id,status:'Requested',t:Date.now(),abn:false,ack:false,urgent:$('#urg').checked});p.events.push([Date.now(),'Ordered: '+o.dataset.t]);log('lab',`${o.dataset.t} ordered for <b>${esc(p.name)}</b>`);save();toast(o.dataset.t+' ordered');closeM()})})});
};

let labF='all';

 return `<div class="grid g4" style="margin-bottom:18px">${kpi('Awaiting results',DB.labs.filter(l=>l.status!=='Resulted').length,'Requested, collected or in the lab','',null,'var(--blue)','lab','var(--blue-l)')}${kpi('Abnormal, not seen',DB.labs.filter(l=>l.abn&&!l.ack).length,'Need a clinician to acknowledge','down',null,'var(--crit)','alert','var(--crit-l)')}${kpi('Urgent requests',DB.labs.filter(l=>l.urgent&&l.status!=='Resulted').length,'Prioritised in the lab','',null,'var(--high)','op','var(--high-l)')}${kpi('Resulted today',DB.labs.filter(l=>l.status==='Resulted'&&new Date(l.rt||l.t).toDateString()===new Date().toDateString()).length,'Across all wards','up',null,'var(--ok)','check','var(--ok-l)')}</div>
 <div class="card"><div class="ch"><div class="filters">${[['all','All'],['abn','Abnormal, not seen'],['pending','Awaiting result'],['urgent','Urgent']].map(f=>`<button class="fbtn" data-lf="${f[0]}" aria-pressed="${labF===f[0]}">${f[1]}</button>`).join('')}</div></div>
 <div class="tw"><table><thead><tr><th>Test</th><th>Patient</th><th>Ordered</th><th>Status</th><th></th></tr></thead><tbody>${L.map(l=>{const p=P(l.pid);return `<tr><td><b>${esc(l.test)}</b> ${l.urgent?'<span class="chip c-high">Urgent</span>':''}</td><td><span class="lnk" data-go="patient/${p.id}">${esc(p.name)}</span><div class="pmeta">${p.status==='inpatient'?W(p.ward).short:'Discharged'}</div></td><td class="num">${hm(new Date(l.t))}</td>
 <td>${l.val?`<div class="pmeta" style="margin-bottom:3px">${esc(l.val)}</div>`:''}${l.status==='Resulted'?(l.abn?`<span class="chip ${l.ack?'c-med':'c-crit'}"><span class="d"></span>Abnormal${l.ack?', seen':''}</span>`:'<span class="chip c-ok"><span class="d"></span>Normal</span>'):`<span class="chip c-blue">${l.status}</span>`}</td>
 <td style="text-align:right">${l.status==='Requested'?`<button class="btn b-sec b-sm" data-l="col" data-id="${l.id}">Mark collected</button>`:l.status!=='Resulted'?`<button class="btn b-sec b-sm" data-l="res" data-id="${l.id}">Add result</button>`:l.abn&&!l.ack?`<button class="btn b-pri b-sm" data-l="ack" data-id="${l.id}">${ic('check')}Acknowledge</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`};
AFTER.lab=()=>{$$('[data-lf]').forEach(b=>b.addEventListener('click',()=>{labF=b.dataset.lf;refresh()}));
 $$('[data-l]').forEach(b=>b.addEventListener('click',()=>{const l=DB.labs.find(x=>x.id===b.dataset.id);const a=b.dataset.l;

function resultModal(l){const p=P(l.pid);
 modal(`<div class="mh"><h2>Add result: ${esc(l.test)}</h2><p>${esc(p.name)} · ${W(p.ward).name}</p></div><div class="mb"><div><label class="f" for="rVal">Result</label><input class="input" id="rVal" placeholder="e.g. Hb 92 g/L, or 'No acute findings'"></div>

 <div class="mf"><button class="btn b-sec" onclick="closeM()">Cancel</button><button class="btn b-pri" id="rGo">${ic('check')}File result</button></div>`);
 let abn=false;$$('#modal [data-rn]').forEach(o=>o.addEventListener('click',()=>{abn=o.dataset.rn==='1';$$('#modal [data-rn]').forEach(x=>x.setAttribute('aria-pressed',x===o))}));
 $('#rGo').addEventListener('click',()=>{l.status='Resulted';l.abn=abn;l.val=$('#rVal').value.trim();l.rt=Date.now();p.events.push([Date.now(),`${l.test} resulted${l.val?': '+l.val:''}${abn?' (abnormal)':''}`]);log('lab',`${esc(l.test)} resulted for <b>${esc(p.name)}</b>${abn?': abnormal':''}`);save();toast(abn?'Result is abnormal: acknowledge it':'Result filed: normal',abn?'warn':'ok');closeM()})}

function palRun(q){const ql=q.toLowerCase().trim();let ans='',res=[];const m=M();
 const ward=WARDS.find(w=>ql.includes(w.short.toLowerCase())||ql.includes(w.name.toLowerCase())||(w.id==='ccu'&&ql.includes('cardiology'))||(w.id==='surg'&&ql.includes('surgery')));
 if(/free|empty|available/.test(ql)&&/bed/.test(ql)){const f=DB.beds.filter(b=>b.st==='free'&&(!ward||b.ward===ward.id));ans=`<b>${f.length} free bed${f.length===1?'':'s'}</b>${ward?' on '+ward.name:' in the hospital'}${!ward?': '+WARDS.map(w=>`${w.short} ${DB.beds.filter(b=>b.ward===w.id&&b.st==='free').length}`).join(' · '):''}`;res.push(['bed','Open beds & wards','See and admit',()=>{if(ward)bedWard=ward.id;closeM();go('beds')}])}
 else if(/longest|wait|breach|4 ?h/.test(ql)){const a=[...DB.ae].sort((x,y)=>x.arr-y.arr)[0];ans=a?`<b>${dur(minsAgo(a.arr))}</b>${esc(a.name)}, ${esc(a.complaint)} · ${m.breach} patient${m.breach===1?'':'s'} over 4 hours`:'A&E is empty';res.push(['ae','Open the A&E board','',()=>{aeFilter='breach';closeM();go('ae')}])}
 else if(/occupan|how full|capacity/.test(ql)){ans=`<b>${m.pct}% occupied</b>${m.occ} of ${m.tot} beds · ${m.free} free · ${m.cln} being cleaned`}
 else if(/news|deteriorat|sick|alert/.test(ql)){const al=DB.beds.filter(b=>bedState(b)==='alert');ans=`<b>${al.length} patient${al.length===1?'':'s'} with NEWS2 7+</b>${al.map(b=>esc(P(b.pid).name)).join(', ')||'None right now'}`;al.forEach(b=>{const p=P(b.pid);res.push(['heart',p.name,`${W(b.ward).short} bed ${b.no} · NEWS2 ${curNews(p).score}`,()=>{closeM();go('patient',p.id)}])})}
 else if(/stock|reorder|pharm/.test(ql)){const low=DB.stock.filter(s=>s.qty<s.min);ans=`<b>${low.length} items below minimum</b>${low.map(s=>s.name).join(', ')}`;res.push(['pill','Open pharmacy','',()=>{closeM();go('pharmacy')}])}
 else if(/staff|nurse|rota|short/.test(ql)){ans=`<b>${m.staff}% of shifts filled</b>${DB.rota.filter(r=>r.have<r.req).length} shifts short today`;res.push(['team','Open staffing','',()=>{closeM();go('staff')}])}
 if(ql.length>=2){Object.values(DB.patients).filter(p=>p.status==='inpatient'&&(p.name.toLowerCase().includes(ql)||p.nhs.replace(/ /g,'').includes(ql.replace(/ /g,'')))).slice(0,6).forEach(p=>res.push(['user',p.name,`${W(p.ward).name} · NHS ${p.nhs} · NEWS2 ${curNews(p).score}`,()=>{closeM();go('patient',p.id)}]))}
 Object.entries(ROUTES).filter(([k,v])=>k!=='patient'&&canSee(k)&&(!ql||v[0].toLowerCase().includes(ql))).forEach(([k,v])=>res.push([{reception:'cam',command:'grid',ae:'ae',beds:'bed',theatres:'op',opd:'team',app:'phone',patients:'user',lab:'lab',pharmacy:'pill',staff:'team',billing:'bill'}[k],'Go to '+v[0],v[1],()=>{closeM();go(k)}]));
 $('#pres').innerHTML=(ans?`<div class="answer">${ans}</div>`:'')+res.slice(0,9).map((r,i)=>`<button class="pr" data-i="${i}"><span class="pi">${ic(r[0])}</span><span><b>${esc(r[1])}</b><span>${esc(r[2])}</span></span></button>`).join('')+(!ans&&!res.length?'<div class="empty">No match. Try "free beds", "longest wait" or a patient name.</div>':'');

function tick(){if(!liveOn||document.hidden||$('.scrim.open')||tourI>=0)return;const rnd=Math.random,pk=a=>a[Math.floor(rnd()*a.length)];
 const free=DB.beds.filter(x=>x.st==='free');
 // 1. A&E arrivals, only while the department is not overflowing
 if(DB.ae.length<24&&rnd()<.09){const c=pk([['Chest pain','orange'],['Fall, hip pain','yellow'],['Breathing difficulty','orange'],['Cut to forearm','green'],['Abdominal pain','yellow'],['Sprained ankle','blue']]);const n=pk(FN)+' '+pk(LN);
  DB.ae.push({id:'A'+(DB.seq++)+'s',name:n,age:18+Math.floor(rnd()*70),sex:rnd()<.5?'F':'M',complaint:c[0],tri:c[1],arr:Date.now(),status:'Waiting for triage',area:c[1]==='blue'||c[1]==='green'?'Minors':'Majors'});log('ae',`<b>${esc(n)}</b> arrived in A&amp;E: ${c[0]}`)}
 // 2. A&E patients move through: triage, assessment, then home or admission
 if(rnd()<.12){const a=DB.ae.filter(x=>x.status==='Waiting for triage'&&minsAgo(x.arr)>=10).sort((x,y)=>x.arr-y.arr)[0];if(a){a.status='Waiting for clinician';if(a.tri==='red')a.area='Resus'}}
 if(rnd()<.11){const a=DB.ae.find(x=>x.status==='Waiting for clinician');if(a)a.status='In assessment'}
 if(rnd()<.1){const a=DB.ae.filter(x=>x.status==='In assessment'||x.status==='Awaiting results').sort((x,y)=>x.arr-y.arr)[0];if(a){const r=rnd();
  if(r<.5){DB.ae=DB.ae.filter(x=>x!==a);log('dis',`<b>${esc(a.name)}</b> discharged home from A&amp;E`)}
  else if(r<.7)a.status='Awaiting results';
  else{a.status='Decision to admit';a.target=pk(['amu','resp','surg','elder','ccu','ortho']);log('ae',`Decision to admit <b>${esc(a.name)}</b> to ${W(a.target).name}`)}}}
 // 3. The bed manager places patients who have been waiting a while
 if(free.length>2&&rnd()<.06){const a=DB.ae.filter(x=>x.status==='Decision to admit'&&minsAgo(x.arr)>30).sort((x,y)=>x.arr-y.arr)[0];if(a){const b=free.find(x=>x.ward===a.target)||free[0];admitTo(a,b,null,true)}}
 // 4. Cleaning and discharges keep beds turning over
 if(rnd()<.05){const b=DB.beds.filter(x=>x.st==='cln');if(b.length){const x=pk(b);x.st='free';log('cln',`${W(x.ward).short} bed ${x.no} cleaned and ready`)}}
 if(rnd()<.035){const b=DB.beds.filter(x=>x.dis);if(b.length){const x=pk(b);const p=P(x.pid);p.status='discharged';p.bed=null;p.dischargedAt=Date.now();p.events.push([Date.now(),'Discharged home']);x.st='cln';x.pid=null;x.dis=false;log('dis',`<b>${esc(p.name)}</b> went home from ${W(x.ward).name}`)}}
 if(DB.beds.filter(x=>x.dis).length<6&&rnd()<.05){const b=DB.beds.filter(x=>x.st==='occ'&&!x.dis&&bedState(x)==='occ'&&Date.now()-P(x.pid).admitted>DAY).sort((x,y)=>P(x.pid).edd-P(y.pid).edd).slice(0,8);if(b.length){const x=pk(b);x.dis=true;P(x.pid).edd=Date.now();P(x.pid).events.push([Date.now(),'Discharge planned for today'])}}
 // 5. Observations: a few patients get worse, and treated patients recover
 const alerts=DB.beds.filter(x=>bedState(x)==='alert');
 if(alerts.length<6&&rnd()<.025){const b=DB.beds.filter(x=>x.st==='occ'&&bedState(x)==='occ');if(b.length){const x=pk(b);const p=P(x.pid);const o=Object.assign({},p.obs[p.obs.length-1],{t:Date.now(),rr:26,spo2:90,hr:122,sbp:96,o2:true});p.obs.push(o);const n=news2(o);p.events.push([Date.now(),`Observations: NEWS2 ${n.score}`]);log('alert',`<b>${esc(p.name)}</b> NEWS2 ${n.score} on ${W(x.ward).short} bed ${x.no}: review now`);if(route==='command')toast(`${esc(p.name)}: NEWS2 ${n.score}. Outreach team alerted.`,'warn')}}
 if(alerts.length&&rnd()<.02){const x=pk(alerts);const p=P(x.pid);const last=p.obs[p.obs.length-1];if(minsAgo(last.t)>=10){const o={t:Date.now(),rr:18,spo2:95,o2:false,sbp:122,hr:88,avpu:'A',temp:37.1};p.obs.push(o);p.events.push([Date.now(),`Observations after treatment: NEWS2 ${news2(o).score}`]);log('adm',`<b>${esc(p.name)}</b> improving after review, NEWS2 ${news2(o).score}`)}}
 // 6. Lab: new requests come in, and samples move through the lab
 if(DB.labs.filter(x=>x.status!=='Resulted').length<9&&rnd()<.06){const ps=Object.values(DB.patients).filter(p=>p.status==='inpatient');if(ps.length){const p=pk(ps);const t=pk(['Full blood count','U&E','CRP','Troponin','Chest X-ray','Lactate','LFTs']);DB.labs.unshift({id:'L'+(3000+DB.seq++),test:t,pid:p.id,status:'Requested',t:Date.now(),abn:false,ack:false,urgent:rnd()<.25});log('lab',`${t} requested for <b>${esc(p.name)}</b>`)}}
 if(rnd()<.07){const l=DB.labs.filter(x=>x.status==='Collected'||x.status==='In lab');if(l.length){const x=l[l.length-1];if(x.status==='Collected')x.status='In lab';else{x.status='Resulted';x.rt=Date.now();x.abn=rnd()<.3;log('lab',`${esc(x.test)} resulted for <b>${esc(P(x.pid).name)}</b>${x.abn?': abnormal':''}`)}}}
 if(rnd()<.05){const l=DB.labs.find(x=>x.status==='Requested'&&minsAgo(x.t)>15);if(l)l.status='Collected'}
 DB.labs=DB.labs.slice(0,60);
 // 7. Outpatients: clinics keep moving, and keep running during clinic hours
 if(rnd()<.1){const c=pk(CLINICS);advance(c.id,false)}
 const hr=new Date().getHours();if(hr>=7&&hr<21&&rnd()<.1){const c=pk(CLINICS);const q=DB.queues[c.id];if(q.filter(e=>e.status==='booked'||e.status==='arrived').length<6){const oid='O'+c.id+'n'+(DB.seq++);DB.op[oid]={id:oid,name:pk(FN)+' '+pk(LN),age:20+Math.floor(rnd()*65),sex:rnd()<.5?'F':'M',nhs:`${400+Math.floor(rnd()*399)} ${100+Math.floor(rnd()*899)} ${1000+Math.floor(rnd()*8999)}`,allergies:[],conditions:[],visits:[],labs:[],uploads:[]};
  q.push({tok:c.pre+'-'+pad(q.length+1),oid,slot:Date.now()+20*60000,status:'booked',via:pk(['App','App','Phone','Walk-in']),arrivedAt:null,startedAt:null,reason:'New referral'})}}
 // 7b. People arrive at the entrance camera during clinic hours
 if(hr>=7&&hr<21&&rnd()<.03&&DB.cam&&DB.cam.ev.filter(v=>v.st==='pending').length<3)walkIn(false);
 // 8. Old discharged records stop the database from growing forever
 const gone=Object.values(DB.patients).filter(p=>p.status==='discharged'&&Date.now()-(p.dischargedAt||0)>2*DAY);if(gone.length>40)gone.slice(0,gone.length-40).forEach(p=>{if(!DB.labs.some(l=>l.pid===p.id)&&!DB.rx.some(r=>r.pid===p.id))delete DB.patients[p.id]});
 save();if(['command','ae','beds','lab','opd','reception'].includes(route)&&!(route==='reception'&&document.activeElement&&document.activeElement.type==='file'))refresh();else if(route==='app'&&appTab==='home'&&!document.activeElement.closest('.phone'))repaintPhone();else badges()}
setInterval(tick,5000);

/* ================= role ================= */
const ROLE={ops:['Rachel Osei','RO','command'],nurse:['Sister Joanne Pike','JP','beds'],dr:['Dr Samuel Adeyemi','SA','opd'],fin:['Martin Hale','MH','billing'],rec:['Priya Shah','PS','reception']};
function applyRole(){const r=ROLE[role];$('#meName').textContent=r[0];$('#meAv').textContent=r[1];$('#role').value=role;
 $$('.side .nav[data-r],.mnav [data-r]').forEach(n=>{n.hidden=!canSee(n.dataset.r)});
 $$('.side .ngroup').forEach(g=>{let n=g.nextElementSibling,any=false;while(n&&n.classList.contains('nav')){if(!n.hidden)any=true;n=n.nextElementSibling}g.hidden=!any})}
$('#role').addEventListener('change',e=>{role=e.target.value;try{localStorage.setItem('lu_role',role)}catch(_){ }applyRole();toast('Signed in as '+ROLE[role][0]+'. Menu shows what this role may open.');go(ROLE[role][2])});

/* catch up after the page was closed: keep every wait, queue and list relative to now */
function catchUp(){const last=DB.savedAt;if(!last)return;const d=Date.now()-last;if(d<5*60000)return;
 const days=Math.round((new Date().setHours(0,0,0,0)-new Date(last).setHours(0,0,0,0))/DAY);
 const TK=new Set(['t','arr','arrivedAt','startedAt','admitted','edd','dischargedAt','slot','rt']);
 const walk=o=>{if(Array.isArray(o)){if(o.length===2&&typeof o[0]==='number'&&typeof o[1]==='string'&&o[0]>1e12){o[0]+=d;return}o.forEach(walk);return}if(o&&typeof o==='object'){for(const k in o){const v=o[k];if(TK.has(k)&&typeof v==='number'&&v>1e12)o[k]=v+d;else if(v&&typeof v==='object')walk(v)}}};
 const keep={th:DB.theatres,inv:DB.invoices,stock:DB.stock,up:DB.op&&DB.op.me&&DB.op.me.upcoming};DB.theatres=[];DB.invoices=[];DB.stock=[];if(keep.up)DB.op.me.upcoming=[];
 walk(DB);DB.theatres=keep.th;DB.invoices=keep.inv;DB.stock=keep.stock;if(keep.up)DB.op.me.upcoming=keep.up;
 if(days>0){DB.theatres.forEach(c=>{c.start+=days*DAY;c.end+=days*DAY;c.status='scheduled'});DB.rota.forEach(r=>{r.have=Math.max(1,r.req-(Math.random()<.16?1:0))})}
 DB.savedAt=Date.now()}
/* boot */
try{DB=JSON.parse(localStorage.getItem('lumora_v2'))}catch(e){}
if(!DB||!DB.beds||!DB.queues)DB=genData();else catchUp();
ensureFace();
applyRole();
if(!DB.feed.length){['Bed 7 on Ortho cleaned and ready','<b>Derek Holt</b> admitted from A&amp;E to Respiratory, bed 4','Theatre 2 list started on time','<b>Ivy Barker</b> went home from Elderly Care'].forEach((t,i)=>DB.feed.push({t:Date.now()-(i+1)*7*60000,type:['cln','adm','op','dis'][i],txt:t}))}
const [r0,p0]=location.hash.slice(1).split('-');if(r0&&ROUTES[r0]){route=r0;param=p0||null}
$('#tourBtn').addEventListener('click',startTour);
render();try{if(!localStorage.getItem('lu_welcome')){localStorage.setItem('lu_welcome','1');setTimeout(welcome,500)}}catch(e){setTimeout(welcome,500)}
$('#clock').textContent=hm(new Date());
</script>
